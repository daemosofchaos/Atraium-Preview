    <rect x="2.5" y="3.5" width="19" height="17" rx="2" />
    <circle cx="9" cy="9" r="1.5" />
    <path d="m5.5 17 4.2-4.5 3 3 2.2-2.2 3.5 3.7" />
  </g>

  <text
    x="590"
    y="468"
    fill="#8A5C46"
    font-size="16.5"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="700"
