  </text>

  <!-- Combined workflow callout -->
  <rect
    x="80"
    y="660"
    width="1240"
    height="132"
    rx="28"
    fill="#F4E9DD"
    fill-opacity="0.94"
    stroke="#CCB39E"
  />

  <text
    x="120"
    y="706"
    fill="#8A5C46"
    font-size="17"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="700"
  >
    One assistant can manage several projects
  </text>

  <text
    x="120"
    y="749"
    fill="#4F392E"
    font-size="27"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="800"
  >
    Research the facts → write the brief → create visuals → build the deck
  </text>

  <text
    x="120"
    y="776"
    fill="#6B5448"
    font-size="17"
    font-family="Segoe UI, Arial, sans-serif"
  >
    Keep the chain in one Workspace, or split it into focused project desks.
  </text>
