  <g
    transform="translate(969 243)"
    fill="none"
    stroke="#FFF8F2"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="2.5" y="3.5" width="19" height="13.5" rx="1.8" />
    <path d="M12 17v4" />
    <path d="M8 21h8" />
    <path d="m7 13 3-3 2.8 2.6 4.2-4.1" />
  </g>

  <text
    x="1016"
    y="260"
    fill="#8A5C46"
    font-size="16.5"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="700"
  >
    Presentation room
  </text>

  <text
    x="962"
    y="312"
    fill="#4F392E"
    font-size="26"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="800"
