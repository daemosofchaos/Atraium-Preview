  <rect x="110" y="444" width="38" height="38" rx="11" fill="#9B8473" />

  <g
    transform="translate(117 451)"
    fill="none"
    stroke="#FFF8F2"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
