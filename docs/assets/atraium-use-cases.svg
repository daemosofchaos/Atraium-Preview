  <rect x="536" y="444" width="38" height="38" rx="11" fill="#C3924F" />

  <g
    transform="translate(543 451)"
    fill="none"
    stroke="#4F392E"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
