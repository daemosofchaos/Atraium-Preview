<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1400"
  height="860"
  viewBox="0 0 1400 860"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Atraium room examples</title>
  <desc>
    Six example Atraium room roles: developer, document, presentation, research,
    image, and desktop-workflow rooms.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A3F33" />
      <stop offset="0.55" stop-color="#6A4B3A" />
      <stop offset="1" stop-color="#8A5C46" />
    </linearGradient>

    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBF5EF" />
      <stop offset="1" stop-color="#E8D8CB" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="860" rx="32" fill="url(#bg)" />
  <circle cx="1245" cy="100" r="170" fill="#C99843" fill-opacity="0.16" />
  <circle cx="170" cy="760" r="185" fill="#F4E1CD" fill-opacity="0.10" />
  <circle cx="1320" cy="746" r="155" fill="#9B8473" fill-opacity="0.10" />

  <!-- Heading -->
  <text
    x="80"
    y="108"
    fill="#FFF9F4"
    font-size="48"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="800"
  >
    One Atraium platform. Many ways to work.
  </text>

  <text
    x="80"
    y="150"
    fill="#F4E6DA"
    font-size="21"
    font-family="Segoe UI, Arial, sans-serif"
  >
    Rooms give assistants an identity; Workspaces give projects instructions and tools.
  </text>

  <!-- Developer room -->
  <rect x="80" y="210" width="388" height="188" rx="26" fill="url(#tile)" stroke="#CCB39E" />
  <rect x="110" y="236" width="38" height="38" rx="11" fill="#C99843" />

  <g
    transform="translate(117 243)"
    fill="none"
    stroke="#4F392E"
    stroke-width="1.9"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M8 6 2.5 12 8 18" />
    <path d="m16 6 5.5 6-5.5 6" />
    <path d="m13.5 4-3 16" />
  </g>

  <text
    x="164"
    y="260"
    fill="#8A5C46"
    font-size="16.5"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="700"
