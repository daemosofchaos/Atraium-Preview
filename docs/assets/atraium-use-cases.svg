    <path d="M5 2.5h8l3.5 3.5v6" />
    <path d="M13 2.5V6h3.5" />
    <path d="M7.5 10h4.5" />
    <circle cx="15.5" cy="15.5" r="3.5" />
    <path d="m18 18 2.5 2.5" />
  </g>

