  </text>

  <!-- Desktop workflow room -->
  <rect x="932" y="418" width="388" height="188" rx="26" fill="url(#tile)" stroke="#CCB39E" />
  <rect x="962" y="444" width="38" height="38" rx="11" fill="#714E3D" />

  <g
    transform="translate(969 451)"
    fill="none"
    stroke="#FFF8F2"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="2.5" y="3.5" width="19" height="13.5" rx="1.8" />
    <path d="M12 17v4" />
    <path d="M8 21h8" />
    <path d="M7 8h5" />
    <path d="M7 11h8" />
  </g>

  <text
    x="1016"
    y="468"
    fill="#8A5C46"
    font-size="16.5"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="700"
  >
    Desktop workflow room
  </text>

  <text
    x="962"
    y="520"
    fill="#4F392E"
    font-size="26"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="800"
  >
    Carry work through
  </text>

  <text
    x="962"
    y="558"
    fill="#6B5448"
    font-size="17"
    font-family="Segoe UI, Arial, sans-serif"
  >
