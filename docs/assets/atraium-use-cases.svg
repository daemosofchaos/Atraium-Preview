  <rect x="506" y="210" width="388" height="188" rx="26" fill="url(#tile)" stroke="#CCB39E" />
  <rect x="536" y="236" width="38" height="38" rx="11" fill="#B88342" />

  <g
    transform="translate(543 243)"
    fill="none"
    stroke="#4F392E"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M6 2.5h8l4 4v14H6z" />
    <path d="M14 2.5v4h4" />
    <path d="M8.5 12h7" />
    <path d="M8.5 15.5h5" />
