    <linearGradient id="hero-bg" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse"><stop stop-color="#162019"/><stop offset="1" stop-color="#2B4031"/></linearGradient>
    <linearGradient id="hero-paper" x1="736" y1="64" x2="1336" y2="744" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#F0E5D6"/></linearGradient>
    <clipPath id="hero-clip"><rect width="1400" height="820" rx="32"/></clipPath>
  </defs>
