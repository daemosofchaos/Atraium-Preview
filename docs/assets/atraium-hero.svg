<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" fill="none" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Atraium: give an assistant a complete project</title>
  <desc id="hero-desc">Bring a hosted or local model and the tools it needs. Delegate an application, a project costing or a launch package, and keep source files, checks, documents and project records. Illustrated deliverables, not an application screenshot or a guarantee of model performance.</desc>
