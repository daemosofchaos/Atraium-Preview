<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1400"
  height="820"
  viewBox="0 0 1400 820"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Atraium platform overview</title>
  <desc>
    A diagram showing a reusable model profile flowing into an assistant Room,
    which can use research, desktop, developer, document, image, plugin, MCP, and computer-use capabilities.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A3F33" />
      <stop offset="0.55" stop-color="#6A4B3A" />
      <stop offset="1" stop-color="#8A5C46" />
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBF5EF" />
      <stop offset="1" stop-color="#E9D8C9" />
    </linearGradient>

    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4E9DD" />
      <stop offset="1" stop-color="#DFC8B6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="820" rx="32" fill="url(#bg)" />
  <circle cx="1240" cy="110" r="180" fill="#C99843" fill-opacity="0.16" />
  <circle cx="1340" cy="730" r="200" fill="#9B8473" fill-opacity="0.12" />
  <circle cx="150" cy="760" r="190" fill="#F4E1CD" fill-opacity="0.10" />

